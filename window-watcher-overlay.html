<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Watcher — Overlay</title>
<style>
/* ============================================================
   Window Watcher — OBS overlay (browser source)
   Dependency-free. Appearance from URL params; title data over
   the Streamer.bot WebSocket as General.Custom broadcasts.
   Size the box by scaling the browser source in OBS.

   Params:
     host, port           Streamer.bot address (default 127.0.0.1:8080)
     accent  hex w/o #     (default a855f7)
     theme   dark | light  (default dark)
     in      fade-in ms     (default 800)
     out     fade-out ms    (default 600)
     hold    on-screen sec  (default 30)
     artist  1 | 0          (default 1)
     debug   1              (status + self-test)
   ============================================================ */

:root { --accent:#a855f7; }
[data-theme="dark"]  { --box-bg:rgba(12,7,22,.82);  --text:#f2ecff; --muted:#b9addb; --border-mix:38%; }
[data-theme="light"] { --box-bg:rgba(255,255,255,.9); --text:#1c1233; --muted:#5f5480; --border-mix:45%; }

* { box-sizing:border-box; }
html, body { margin:0; height:100%; width:100%; background:transparent; overflow:hidden; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }

/* anchored lower-left; the whole source is scaled/placed in OBS */
#box {
  position:fixed; left:14px; bottom:14px;
  display:inline-flex; align-items:center; gap:11px;
  max-width:calc(100vw - 28px);
  padding:11px 16px 11px 12px;
  border-radius:13px;
  background:var(--box-bg);
  border:1px solid color-mix(in srgb, var(--accent) var(--border-mix), transparent);
  box-shadow:0 8px 26px color-mix(in srgb, var(--accent) 26%, transparent);
  backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  color:var(--text); opacity:0; white-space:nowrap; will-change:transform,opacity;
}
#icon { width:36px; height:36px; border-radius:9px; display:grid; place-items:center; font-weight:700; font-size:16px; color:#fff; background:var(--accent); flex-shrink:0; }
#text { display:flex; flex-direction:column; line-height:1.25; min-width:0; }
#primary { font-weight:600; font-size:15px; letter-spacing:-.005em; overflow:hidden; text-overflow:ellipsis; }
#secondary { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; }

#dbg { position:fixed; top:8px; left:8px; font:11px/1.4 ui-monospace,monospace; color:#8de; background:rgba(0,0,0,.55); padding:6px 9px; border-radius:6px; display:none; white-space:pre; }
body[data-debug="1"] #dbg { display:block; }
</style>
</head>
<body>
  <div id="box">
    <div id="icon">•</div>
    <div id="text"><span id="primary"></span><span id="secondary"></span></div>
  </div>
  <div id="dbg">starting…</div>

<script>
"use strict";
const P = new URLSearchParams(location.search);
const HOST   = P.get("host") || "127.0.0.1";
const PORT   = P.get("port") || "8080";
const PASS   = P.get("pass") || "";
const ACCENT = "#" + (P.get("accent") || "a855f7").replace(/^#/, "");
const THEME  = P.get("theme") === "light" ? "light" : "dark";
const IN_MS  = clampNum(P.get("in"), 200, 4000, 800);
const OUT_MS = clampNum(P.get("out"), 200, 4000, 600);
const HOLD_S = clampNum(P.get("hold"), 1, 600, 30);
const ARTIST = P.get("artist") !== "0";
const DEBUG  = P.get("debug") === "1";
function clampNum(v, lo, hi, d){ const n = parseInt(v,10); return isNaN(n) ? d : Math.min(hi, Math.max(lo, n)); }

document.documentElement.style.setProperty("--accent", ACCENT);
document.documentElement.dataset.theme = THEME;
document.body.dataset.debug = DEBUG ? "1" : "0";
const box = document.getElementById("box");
const iconEl = document.getElementById("icon");
const primaryEl = document.getElementById("primary");
const secondaryEl = document.getElementById("secondary");
const EASE = "cubic-bezier(.22,.61,.36,1)";
function dbg(m){ if(DEBUG) document.getElementById("dbg").textContent = m; }

/* slide + fade UP on enter, fade up-and-out on leave */
let leaveTimer;
function enter(){
  box.style.transition = "none";
  box.style.opacity = "0";
  box.style.transform = "translateY(16px)";
  void box.offsetWidth;
  box.style.transition = "transform "+IN_MS+"ms "+EASE+", opacity "+IN_MS+"ms "+EASE;
  box.style.opacity = "1";
  box.style.transform = "translateY(0)";
}
function leave(){
  box.style.transition = "transform "+OUT_MS+"ms "+EASE+", opacity "+OUT_MS+"ms "+EASE;
  box.style.opacity = "0";
  box.style.transform = "translateY(-10px)";
}
function pop(){ enter(); clearTimeout(leaveTimer); leaveTimer = setTimeout(leave, IN_MS + HOLD_S*1000); }

function show(d){
  iconEl.style.background = (d.color && d.color !== "") ? d.color : ACCENT;
  const label = d.label || d.site || "";
  iconEl.textContent = (label[0] || "•").toUpperCase();
  primaryEl.textContent = d.primary || d.label || "";
  const wantSec = d.state === "playing" && ARTIST && d.secondary;
  secondaryEl.textContent = wantSec ? d.secondary : "";
  secondaryEl.style.display = wantSec ? "" : "none";
  pop();
  dbg("shown: " + (d.primary || d.label || "?"));
}

/* Streamer.bot connection with reconnect backoff */
let ws, backoff = 1000;
async function sha(str){ const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str)); return btoa(String.fromCharCode(...new Uint8Array(b))); }
function send(o){ if(ws && ws.readyState===1){ o.id=o.id||("m"+Date.now()); ws.send(JSON.stringify(o)); } }
function connect(){
  dbg("connecting ws://"+HOST+":"+PORT+" …");
  try { ws = new WebSocket("ws://"+HOST+":"+PORT+"/"); } catch(e){ retry(); return; }
  ws.onopen = () => { if(!PASS) ready(); };
  ws.onclose = () => { dbg("disconnected — retrying"); retry(); };
  ws.onerror = () => dbg("connection error");
  ws.onmessage = async (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if(m.authentication && m.authentication.salt){ const s = await sha(PASS + m.authentication.salt); send({ request:"Authenticate", authentication: await sha(s + m.authentication.challenge) }); return; }
    if((m.request==="Hello" && !m.authentication) || (m.status==="ok" && backoff!==1000)){ ready(); return; }
    if(m.event && m.event.type==="Custom" && m.data && m.data.v){ show(m.data); }
  };
}
function ready(){ backoff = 1000; send({ request:"Subscribe", events:{ General:["Custom"] } }); dbg("connected — waiting for titles"); }
function retry(){ setTimeout(connect, backoff); backoff = Math.min(15000, backoff*2); }

connect();
if(DEBUG) setTimeout(() => show({ v:1, site:"youtube", label:"YouTube", state:"browsing", primary:"Debug — overlay is rendering", secondary:null, color:"#ff4d4d" }), 600);
</script>
</body>
</html>

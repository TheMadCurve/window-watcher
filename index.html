<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Window Watcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="brand">
      <img class="logo-dark" src="./images/windowwatcher-logo-darkmode.png" alt="Window Watcher">
      <img class="logo-light" src="./images/windowwatcher-logo-lightmode.png" alt="Window Watcher">
    </div>
    <div class="headbar">
      <img id="statusIcon" alt="Disconnected" data-state="disconnected" title="Disconnected">
      <div class="right">
        <div class="seg" role="group" aria-label="Theme"><button id="thDark" aria-pressed="true">Dark</button><button id="thLight" aria-pressed="false">Light</button></div>
        <button class="iconbtn" id="menuBtn" aria-expanded="false" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <nav id="menu" hidden>
    <button data-view="behavior">Behavior</button>
    <button data-view="connection">Connection</button>
  </nav>

  <div class="notice" id="offline">
    <span>Not connected to Streamer.bot.</span>
    <button class="linkbtn" id="retryBtn">Retry</button>
    <a href="https://themadcurve.notion.site/Window-Watcher-3b947d7b963780dcb2dbd20a4332dcca" id="guideLink" target="_blank" rel="noopener">Setup guide</a>
  </div>

  <!-- HOME: watched sites -->
  <section class="view" id="view-sites">
    <section class="card">
      <h1>Watched Sites</h1>
      <div id="siteList"></div>
      <details class="disclosure">
        <summary>Add a site</summary>
        <div class="addgrid">
          <div class="full"><label for="asName">Name</label><input class="inp" id="asName" placeholder="SoundCloud"></div>
          <div class="full"><label for="asSuffix">Tab title ends with</label><input class="inp mono" id="asSuffix" placeholder=" - SoundCloud"></div>
          <div><label for="asMode">Show</label><select class="inp" id="asMode"><option value="full">Full title</option><option value="media">Track • artist</option></select></div>
          <div><label for="asColor">Icon color</label><input class="inp" id="asColor" type="color" value="#a855f7"></div>
          <div class="full"><button class="btn primary" id="addBtn">Add site</button></div>
        </div>
      </details>
    </section>
    <button class="btn primary" id="reshowBtn" disabled>Reshow now</button>
    <div class="subtle" id="saveState"></div>
  </section>

  <!-- APPEARANCE -->
  <section class="view" id="view-appearance" hidden>
    <div class="subhead"><button class="back" data-back>‹ Back</button><h1>Appearance</h1></div>
    
    <div class="previewSlot"></div>
  </section>

  <!-- BEHAVIOR -->
  <section class="view" id="view-behavior" hidden>
    <div class="subhead"><button class="back" data-back>‹ Back</button><h1>Behavior</h1></div>
    <section class="card">
      <section class="card">
        <div class="row"><span class="lbl">Theme</span>
          <div class="seg" role="group" aria-label="Theme"><button id="thDark" aria-pressed="true">Dark</button><button id="thLight" aria-pressed="false">Light</button></div>
        </div>
        <div class="swatches" id="swatches"></div>
        <div class="hexrow"><div class="hexdot" id="hexDot"></div><input class="inp mono" id="hexInput" value="#A855F7" maxlength="7" aria-label="Custom accent"><span class="note">custom hex</span></div>
      </section>
      <div class="field"><label>On-screen time <span class="val" id="durVal">30s</span></label><input type="range" id="duration" min="5" max="120" step="1" value="30"></div>
      <div class="row"><span class="lbl">Alignment</span>
        <div class="seg" role="group" aria-label="Alignment"><button id="alLeft" aria-pressed="false">Left</button><button id="alCenter" aria-pressed="true">Center</button><button id="alRight" aria-pressed="false">Right</button></div>
      </div>
      <div class="row"><span class="lbl">Show artist line</span><input type="checkbox" class="toggle" id="showArtist" checked></div>
      <details class="disclosure"><summary>Fade timing</summary>
        <div class="grid2">
          <div class="field"><label>Fade in <span class="val" id="inVal">800ms</span></label><input type="range" id="fadeIn" min="200" max="2000" step="50" value="800"></div>
          <div class="field"><label>Fade out <span class="val" id="outVal">600ms</span></label><input type="range" id="fadeOut" min="200" max="2000" step="50" value="600"></div>
        </div>
      </details>
      <p class="subtle left">Resize the box by scaling the browser source in OBS.</p>
    </section>
    <div class="previewSlot"></div>
  </section>

  <!-- CONNECTION -->
  <section class="view" id="view-connection" hidden>
    <div class="subhead"><button class="back" data-back>‹ Back</button><h1>Connection</h1></div>
    <section class="card">
      <div class="statusline"><img id="statusIcon2" alt=""><b id="connText">Disconnected</b><button class="linkbtn" id="retryBtn2">Reconnect</button></div>
      <div class="grid2">
        <div class="field"><label for="sbHost">Address</label><input class="inp mono" id="sbHost" value="127.0.0.1"></div>
        <div class="field"><label for="sbPort">Port</label><input class="inp mono" id="sbPort" value="8080"></div>
      </div>
      <div class="field"><label for="sbPass">Password (optional)</label><input class="inp mono" id="sbPass" type="password" placeholder="none"></div>
    </section>
    <section class="card">
      <h2>OBS overlay</h2>
      <button class="btn primary" id="overlayBtn">Copy overlay URL</button>
      <details class="disclosure export"><summary>Raw config</summary><pre id="configOut">{}</pre>
        <div class="btns"><button class="btn ghost" id="copyCfg">Copy config JSON</button></div>
      </details>
    </section>
  </section>

</div>

<!-- preview block, relocated into the active view -->
<div id="previewHolder" hidden>
  <div id="previewBlock">
    <section class="card">
      <h2>Preview <span class="side">live box</span></h2>
      <div class="stage">
        <div class="checker"></div>
        <div class="box" id="box">
          <div class="bi" id="bIcon">Y</div>
          <div><div class="bp" id="bPrimary">This is a Preview</div><div class="bs" id="bSecondary"></div></div>
        </div>
      </div>
      <div class="btns"><button class="btn ghost" id="testBtn">Test pop</button><button class="btn ghost" id="exitBtn">Play exit</button></div>
    </section>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="./script.js"></script>
</body>
</html>
